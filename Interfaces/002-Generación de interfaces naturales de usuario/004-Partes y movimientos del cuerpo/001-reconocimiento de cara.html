<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MediaPipe Face Detector</title>

  <style>
    body{
      background:#222;
      color:white;
      font-family:monospace;
    }

    #contenedor{
      position:relative;
      width:640px;
      height:480px;
    }

    video,
    canvas{
      position:absolute;
      left:0;
      top:0;
      width:640px;
      height:480px;
    }

    video{
      opacity:0;
    }

    canvas{
      z-index:2;
    }

    :root{
      color-scheme:light;
      --naranja:#f97316;
      --azul:#1d4ed8;
      --azul-claro:#eff6ff;
      --blanco:#fff;
      --negro:#111827;
    }

    body{
      min-height:100vh;
      margin:0;
      padding:32px 18px;
      display:flex;
      flex-direction:column;
      align-items:center;
      gap:18px;
      background:var(--azul-claro);
      color:var(--negro);
      font-family:Arial,sans-serif;
    }

    h1{
      width:min(100%,800px);
      margin:0;
      padding:18px 22px;
      border-top:5px solid var(--naranja);
      border-radius:12px;
      background:var(--blanco);
      color:var(--azul);
      font-size:clamp(1.4rem,4vw,2rem);
      box-shadow:0 10px 30px #11182714;
    }

    #contenedor{
      width:min(100%,800px);
      height:auto;
      aspect-ratio:4/3;
      overflow:hidden;
      border:3px solid var(--azul);
      border-radius:12px;
      background:var(--negro);
      box-shadow:0 16px 36px #11182724;
    }

    video,canvas{
      width:100%;
      height:100%;
    }

    @media(max-width:520px){
      body{padding:18px 12px}
    }
  </style>
</head>

<body>

  <h1>MediaPipe Face Detector</h1>

  <div id="contenedor">
    <video
      id="video"
      width="640"
      height="480"
      autoplay
      muted
      playsinline>
    </video>

    <canvas
      id="canvas"
      width="640"
      height="480">
    </canvas>
  </div>


  <script type="module">

    import {
      FaceDetector,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";


    const video = document.querySelector("#video");
    const canvas = document.querySelector("#canvas");
    const ctx = canvas.getContext("2d");


    // ============================================
    // 1. WEBCAM
    // ============================================

    const stream = await navigator.mediaDevices.getUserMedia({
      video:{
        width:640,
        height:480
      }
    });

    video.srcObject = stream;

    await video.play();

    console.log("Webcam funcionando");
    console.log(
      "Resolución:",
      video.videoWidth,
      video.videoHeight
    );


    // ============================================
    // 2. MEDIAPIPE
    // ============================================

    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
    );


    const detector = await FaceDetector.createFromOptions(
      vision,
      {
        baseOptions:{
          modelAssetPath:
          "https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite"
        },

        runningMode:"VIDEO",

        minDetectionConfidence:0.5
      }
    );


    console.log("MediaPipe cargado");


    // ============================================
    // 3. LOOP
    // ============================================

    function detectar(){

      // Dibujar webcam
      ctx.drawImage(
        video,
        0,
        0,
        canvas.width,
        canvas.height
      );


      // Detectar caras
      const resultado = detector.detectForVideo(
        video,
        performance.now()
      );


      // ============================================
      // DEBUG GLOBAL
      // ============================================

      ctx.fillStyle = "rgba(0,0,0,0.7)";
      ctx.fillRect(10,10,150,50);

      ctx.fillStyle = "white";
      ctx.font = "14px monospace";

      ctx.fillText(
        "Faces: " + resultado.detections.length,
        20,
        32
      );

      ctx.fillText(
        "Video: " + video.readyState,
        20,
        52
      );


      // ============================================
      // CARAS
      // ============================================

      for(const cara of resultado.detections){

        const caja = cara.boundingBox;

        const x = caja.originX;
        const y = caja.originY;
        const w = caja.width;
        const h = caja.height;

        const cx = x + w/2;
        const cy = y + h/2;


        // ------------------------------------------
        // Bounding box
        // ------------------------------------------

        ctx.strokeStyle = "lime";
        ctx.lineWidth = 3;

        ctx.strokeRect(
          x,
          y,
          w,
          h
        );


        // ------------------------------------------
        // Diagonales
        // ------------------------------------------

        ctx.strokeStyle = "lime";
        ctx.lineWidth = 1;

        ctx.beginPath();

        ctx.moveTo(x,y);
        ctx.lineTo(x+w,y+h);

        ctx.moveTo(x+w,y);
        ctx.lineTo(x,y+h);

        ctx.stroke();


        // ------------------------------------------
        // Centro
        // ------------------------------------------

        ctx.strokeStyle = "yellow";

        ctx.beginPath();

        ctx.moveTo(cx-20,cy);
        ctx.lineTo(cx+20,cy);

        ctx.moveTo(cx,cy-20);
        ctx.lineTo(cx,cy+20);

        ctx.stroke();


        // ------------------------------------------
        // Líneas horizontales / verticales
        // ------------------------------------------

        ctx.strokeStyle = "rgba(255,255,0,0.3)";

        ctx.beginPath();

        ctx.moveTo(cx,0);
        ctx.lineTo(cx,canvas.height);

        ctx.moveTo(0,cy);
        ctx.lineTo(canvas.width,cy);

        ctx.stroke();


        // ------------------------------------------
        // Keypoints
        // ------------------------------------------

        for(const punto of cara.keypoints){

          const px = punto.x * canvas.width;
          const py = punto.y * canvas.height;

          ctx.fillStyle = "red";

          ctx.beginPath();

          ctx.arc(
            px,
            py,
            5,
            0,
            Math.PI*2
          );

          ctx.fill();


          // coordenadas

          ctx.fillStyle = "white";
          ctx.font = "11px monospace";

          ctx.fillText(
            Math.round(px) + "," + Math.round(py),
            px + 8,
            py
          );
        }


        // ------------------------------------------
        // Confianza
        // ------------------------------------------

        const confianza =
          cara.categories[0]?.score ?? 0;

        ctx.fillStyle = "lime";
        ctx.font = "16px monospace";

        ctx.fillText(
          "FACE " +
          Math.round(confianza*100) +
          "%",
          x,
          Math.max(20,y-10)
        );

      }


      requestAnimationFrame(detectar);
    }


    // ============================================
    // 4. START
    // ============================================

    detectar();

  </script>

</body>
</html>
