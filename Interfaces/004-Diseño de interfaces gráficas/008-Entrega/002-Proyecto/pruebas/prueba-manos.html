<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <title>
        Prueba Gestos
    </title>

</head>

<body>

    <h1>
        Prueba de Gestos
    </h1>

    <script>

        function accionManoAbierta(){

            return "claro";

        }

        function accionPunoCerrado(){

            return "oscuro";

        }

        console.assert(
            accionManoAbierta() ===
            "claro"
        );

        console.assert(
            accionPunoCerrado() ===
            "oscuro"
        );

        document.write(
            "✅ Gestos validados"
        );

    </script>

</body>

</html>
