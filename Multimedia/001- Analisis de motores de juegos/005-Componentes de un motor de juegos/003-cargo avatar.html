<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Importar GLB - A-Frame</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
    <a-scene>
        <a-gltf-model src="avatar.glb" position="0 0.8 -5" rotation="0 25 0" scale="1.5 1.5 1.5">
        </a-gltf-model>
        <a-plane position="0 0 -5" rotation="-90 0 0" width="20" height="20" color="#2A9D8F">
        </a-plane>
        <a-sky color="#264653"></a-sky>
    </a-scene>
</body>
</html>
