<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Andrei - 5 capas CSS 3D</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        width: 100%;
        min-width: 320px;
        height: 100%;
        margin: 0;
    }

    body {
        display: grid;
        overflow: hidden;
        place-items: center;
        perspective: 1100px;
        background:
            radial-gradient(ellipse at 50% 42%, #202d4c 0%, #101626 38%, #080b14 76%);
        color: #f5f7ff;
        font-family: Inter, "Segoe UI", sans-serif;
    }

    #escena {
        position: relative;
        z-index: 1;
        width: min(80vmin, 500px);
        aspect-ratio: 1;
        transform-style: preserve-3d;
        transition: transform 0.1s ease-out;
    }

    .capa {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 1px solid #dce5ff55;
        border-radius: 20px;
        color: #ffffffeb;
        font-size: clamp(22px, 5vw, 40px);
        font-weight: 700;
        letter-spacing: 0.12em;
        text-shadow: 0 2px 18px #0008;
        transform-style: preserve-3d;
        backface-visibility: hidden;
        box-shadow: inset 0 1px #ffffff20, 0 18px 42px #0002;
    }

    .capa1 {
        background: #f05b6840;
        transform: translateZ(-120px);
    }

    .capa2 {
        background: #ffb45440;
        transform: translateZ(-60px);
    }

    .capa3 {
        background: #51d99b40;
        transform: translateZ(0);
    }

    .capa4 {
        background: #56a9ff40;
        transform: translateZ(60px);
    }

    .capa5 {
        background: #b77bff40;
        transform: translateZ(120px);
    }
</style>
</head>

<body>

<div id="escena">

    <div class="capa capa1">
        CAPA 1
    </div>

    <div class="capa capa2">
        CAPA 2
    </div>

    <div class="capa capa3">
        CAPA 3
    </div>

    <div class="capa capa4">
        CAPA 4
    </div>

    <div class="capa capa5">
        CAPA 5
    </div>

</div>


<script>

const escena = document.querySelector("#escena");

document.addEventListener("mousemove", function(event){

    // Posición del ratón entre -1 y 1

    const x = (event.clientX / window.innerWidth) * 2 - 1;
    const y = (event.clientY / window.innerHeight) * 2 - 1;

    // Rotación máxima

    const rotacionX = -y * 20;
    const rotacionY = x * 20;

    escena.style.transform =
        "rotateX(" + rotacionX + "deg) " +
        "rotateY(" + rotacionY + "deg)";

});

</script>

</body>
</html>
