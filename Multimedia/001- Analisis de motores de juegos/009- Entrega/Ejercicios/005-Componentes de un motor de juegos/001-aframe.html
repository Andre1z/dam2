<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Hola Mundo - A-Frame</title>

    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>

<body>

    <a-scene>

        <!-- Caja -->
        <a-box position="-1.5 0.5 -3.5" rotation="0 45 0" color="#8E44AD" scale="0.2 0.2 0.2">
        </a-box>

        <!-- Esfera -->
        <a-sphere position="0 1.25 -4.5" radius="0.5" color="#3498DB">
        </a-sphere>

        <!-- Cilindro -->
        <a-cylinder position="1.5 0.75 -3.5" radius="0.5" height="1.5" color="#E67E22">
        </a-cylinder>

        <!-- Suelo -->
        <a-plane position="0 0 -4" rotation="-90 0 0" width="8" height="8" color="#A3D9B1">
        </a-plane>

        <!-- Cielo -->
        <a-sky color="#BDE0FE"></a-sky>

        <!-- Texto -->
        <a-text value="Hola Mundo!" position="-1.5 2.5 -4" color="#2C3E50" width="6">
        </a-text>

    </a-scene>

</body>
</html>
