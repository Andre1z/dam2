<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andrei - Capas 3D controladas con la cabeza</title>
<style>
* { box-sizing: border-box; }
html, body { width: 100%; min-width: 320px; height: 100%; margin: 0; }
body {
  display: grid;
  overflow: hidden;
  place-items: center;
  perspective: 1100px;
  background: radial-gradient(ellipse at 50% 42%, #202d4c 0%, #101626 38%, #080b14 76%);
  color: #f5f7ff;
  font-family: Inter, "Segoe UI", sans-serif;
}
#estado {
  position: fixed; top: clamp(14px, 3vw, 28px); left: clamp(14px, 3vw, 28px); z-index: 100;
  max-width: min(420px, calc(100vw - 28px)); padding: 12px 16px;
  border: 1px solid #a9bdff38; border-radius: 14px;
  background: #111a2bd9; color: #e8edff; font-size: 13px; line-height: 1.5;
  box-shadow: 0 10px 32px #0005; backdrop-filter: blur(14px);
}
#pip {
  position: fixed; right: clamp(14px, 3vw, 28px); bottom: clamp(14px, 3vw, 28px); z-index: 100;
  width: min(25vw, 260px); min-width: 150px; aspect-ratio: 4 / 3; overflow: hidden;
  border: 1px solid #a9bdff70; border-radius: 18px; background: #121a2b;
  box-shadow: 0 14px 42px #0008, 0 0 24px #7194ff1c;
}
#pip video, #pip canvas {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
}
#pip canvas { z-index: 2; pointer-events: none; }
#escena {
  position: relative; z-index: 1; width: min(70vw, 650px); aspect-ratio: 1;
  border: 1px solid #c6d3ff26; border-radius: 28px;
  background:
    linear-gradient(#ffffff08 1px, transparent 1px),
    linear-gradient(90deg, #ffffff08 1px, transparent 1px),
    radial-gradient(ellipse at center, #273758aa, #111827cc 72%);
  background-size: 36px 36px, 36px 36px, auto;
  box-shadow: 0 32px 90px #0009, inset 0 1px #ffffff12, 0 0 80px #668cff12;
  transform-style: preserve-3d; will-change: transform;
}
.capa {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  border: 1px solid #dce5ff55; border-radius: 20px;
  color: #ffffffeb; font-size: clamp(22px, 5vw, 42px); font-weight: 700;
  letter-spacing: .12em; text-shadow: 0 2px 18px #0008;
  transform-style: preserve-3d; backface-visibility: hidden;
  box-shadow: inset 0 1px #ffffff20, 0 18px 42px #0002;
}
.capa1 { background: #f05b6838; transform: translateZ(-120px); }
.capa2 { background: #ffb45438; transform: translateZ(-60px); }
.capa3 { background: #51d99b38; transform: translateZ(0); }
.capa4 { background: #56a9ff38; transform: translateZ(60px); }
.capa5 { background: #b77bff38; transform: translateZ(120px); }
.capa img { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
@media (max-width: 600px) {
  #escena { width: min(84vw, 650px); border-radius: 20px; }
  #pip { width: 34vw; min-width: 120px; border-radius: 14px; }
}
</style>
</head>
<body>
<div id="estado">Cargando webcam y MediaPipe…</div>
<div id="pip"><video id="video" autoplay muted playsinline></video><canvas id="debug" width="640" height="480"></canvas></div>
<div id="escena">
  <div class="capa capa1">CAPA 1</div>
  <div class="capa capa2">CAPA 2</div>
  <div class="capa capa3">CAPA 3</div>
  <div class="capa capa4">CAPA 4</div>
  <div class="capa capa5">CAPA 5</div>
</div>
<script type="module">
import {FaceDetector, FilesetResolver} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

const escena = document.querySelector('#escena');
const video = document.querySelector('#video');
const canvas = document.querySelector('#debug');
const ctx = canvas.getContext('2d');
const estado = document.querySelector('#estado');

// Sensibilidad del efecto de ventana 3D.
const ROTACION_X = 28;
const ROTACION_Y = 34;
const DESPLAZAMIENTO_X = 38;
const DESPLAZAMIENTO_Y = 24;
const ESCALA_Z = 0.16;
const SUAVIZADO = 0.10;

let faceDetector;
let referencia = null;
let objetivo = {x:0,y:0,z:0};
let actual = {x:0,y:0,z:0};

const stream = await navigator.mediaDevices.getUserMedia({
  video:{width:{ideal:640},height:{ideal:480},facingMode:'user'},
  audio:false
});
video.srcObject = stream;
await video.play();

const vision = await FilesetResolver.forVisionTasks(
  'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm'
);
faceDetector = await FaceDetector.createFromOptions(vision,{
  baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/latest/blaze_face_short_range.tflite'},
  runningMode:'VIDEO',
  minDetectionConfidence:0.5
});

estado.textContent='Mueve la cabeza: izquierda/derecha, arriba/abajo y cerca/lejos';

function procesarCara(cara){
  const b = cara.boundingBox;
  const cx = b.originX + b.width/2;
  const cy = b.originY + b.height/2;
  const fx = cx/video.videoWidth;
  const fy = cy/video.videoHeight;
  const area = (b.width*b.height)/(video.videoWidth*video.videoHeight);

  if(!referencia) referencia={x:fx,y:fy,area};

  // MediaPipe ve la cámara sin espejo. Invertimos X para que el movimiento
  // visual coincida con el PiP espejado y se comporte como una ventana.
  objetivo.x = -(fx-referencia.x)*2;
  objetivo.y =  (fy-referencia.y)*2;
  objetivo.z = Math.max(-1,Math.min(1,(area/referencia.area)-1));

  const sx=canvas.width/video.videoWidth;
  const sy=canvas.height/video.videoHeight;
  ctx.strokeStyle='#7CFF72';
  ctx.lineWidth=3;
  ctx.strokeRect(b.originX*sx,b.originY*sy,b.width*sx,b.height*sy);
}

function loop(t){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(video.readyState>=2){
    const resultado=faceDetector.detectForVideo(video,t);
    if(resultado.detections.length){
      procesarCara(resultado.detections[0]);
    }else{
      objetivo.x*=0.96;
      objetivo.y*=0.96;
      objetivo.z*=0.96;
    }
  }

  actual.x+=(objetivo.x-actual.x)*SUAVIZADO;
  actual.y+=(objetivo.y-actual.y)*SUAVIZADO;
  actual.z+=(objetivo.z-actual.z)*SUAVIZADO;

  const rotY=actual.x*ROTACION_Y;
  const rotX=-actual.y*ROTACION_X;
  const tx=actual.x*DESPLAZAMIENTO_X;
  const ty=-actual.y*DESPLAZAMIENTO_Y;
  const escala=1+actual.z*ESCALA_Z;

  escena.style.transform=`translate3d(${tx}px,${ty}px,0) rotateX(${rotX}deg) rotateY(${rotY}deg) scale(${escala})`;

  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
