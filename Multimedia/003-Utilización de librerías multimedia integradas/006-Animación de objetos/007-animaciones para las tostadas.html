<!doctype html>
<html lang="es">
	<head>
	<meta charset="UTF-8">
    <style>
      :root{
        --azul:#1d4ed8;
        --naranja:#f97316;
        --blanco:#ffffff;
        --negro:#111827;
      }
      body{
        background:var(--blanco);
      }
      button{
        background:var(--azul);
        color:var(--blanco);
        border:none;
        padding:8px 14px;
        cursor:pointer;
      }
      #tostada{
      	position:fixed;
        right:20px;
        bottom:20px;
        width:200px;
        height:50px;
        padding:20px;
        font-family:sans-serif;
        font-size:11px;
        background:var(--negro);
        color:var(--blanco);
        border:1px solid var(--azul);
        border-left:10px solid var(--naranja);
        display:none;
      }
    </style>
  </head>
  <body>
    <button>Mostrar</button>
    <div id="tostada">
    	Esto es una tostada
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
    <script>
      let boton = document.querySelector("button")
      let tostada = document.querySelector("#tostada")
      boton.onclick = function(){
        // Ya no hacen falta las clases .aparece/.desaparece ni los setTimeout:
        // una timeline encadena aparecer → esperar → desaparecer
        let tl = gsap.timeline()
        tl.set(tostada, {display:"block"})
          .fromTo(tostada, {x:100, opacity:0}, {x:0, opacity:1, duration:1})   // aparece
          .to(tostada, {opacity:0, duration:1}, "+=3")                           // espera 3s y desaparece
          .set(tostada, {display:"none"})
      }
    </script>
	</body>
</html>
