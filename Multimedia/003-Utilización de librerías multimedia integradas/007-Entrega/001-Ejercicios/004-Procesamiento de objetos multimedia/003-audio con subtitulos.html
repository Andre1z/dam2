<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">

<style>

*{
  box-sizing:border-box;
}

body{
  margin:0;
  min-height:100vh;

  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  gap:20px;

  padding:30px 0;

  background:var(--blanco);
  color:var(--negro);

  font-family:Arial,sans-serif;
}


/* ======================================== */
/* REPRODUCTOR */
/* ======================================== */

.jvaudio{

  width:800px;
  max-width:90vw;

  padding:20px;

  display:flex;
  flex-wrap:wrap;

  align-items:center;

  gap:12px;

  background:var(--negro);

  border:3px solid var(--azul);

  border-radius:18px;

  box-shadow:
    0 20px 60px rgba(17,24,39,0.35);

  overflow:hidden;
}


.jvaudio audio{
  display:none;
}



/* ======================================== */
/* BOTONES */
/* ======================================== */

.jvaudio button{

  flex:0 0 44px;

  width:44px;
  height:44px;

  border:none;
  border-radius:50%;

  background:var(--azul);
  color:var(--blanco);

  font-size:17px;

  cursor:pointer;

  display:flex;

  justify-content:center;
  align-items:center;

  transition:
    transform 0.2s,
    background 0.2s,
    color 0.2s;
}


.jvaudio button:hover{

  transform:scale(1.08);

  background:var(--naranja);

}


.jvaudio button:active{

  transform:scale(0.95);

}



/* ======================================== */
/* BOTÓN CC */
/* ======================================== */

.jvaudio .boton-subtitulos{

  font-size:12px;

  font-weight:bold;

}


.jvaudio .boton-subtitulos.activo{

  background:var(--naranja);

  color:var(--blanco);

  box-shadow:0 0 0 2px var(--blanco);

}



/* ======================================== */
/* TIEMPO */
/* ======================================== */

.tiempo{

  flex:0 0 auto;

  white-space:nowrap;

  font-family:monospace;

  font-size:13px;

  color:var(--blanco);

  text-align:center;

}



/* ======================================== */
/* WAVEFORM */
/* ======================================== */

.waveform{

  flex:1 1 0;

  min-width:0;

  width:0;

  height:80px;

  display:block;

  cursor:pointer;

}



/* ======================================== */
/* VOLUMEN */
/* ======================================== */

.volumen{

  flex:0 0 80px;

  width:80px;

  appearance:none;
  -webkit-appearance:none;

  height:4px;

  background:rgba(255,255,255,0.3);

  border-radius:10px;

  cursor:pointer;

  outline:none;

}


.volumen::-webkit-slider-thumb{

  appearance:none;
  -webkit-appearance:none;

  width:13px;
  height:13px;

  border-radius:50%;

  background:var(--naranja);

  cursor:pointer;

}


.volumen::-moz-range-thumb{

  width:13px;
  height:13px;

  border:none;

  border-radius:50%;

  background:var(--naranja);

  cursor:pointer;

}



/* ======================================== */
/* SUBTÍTULOS */
/* ======================================== */

.subtitulos{

  order:100;

  flex:0 0 100%;

  width:100%;

  min-height:32px;

  padding:
    8px
    20px
    0
    20px;

  text-align:center;

  font-size:18px;

  font-weight:bold;

  line-height:1.4;

  color:var(--blanco);

}



/* ======================================== */
/* RESPONSIVE */
/* ======================================== */

@media(max-width:600px){

  .jvaudio{

    gap:7px;

    padding:12px;

  }


  .jvaudio button{

    flex-basis:36px;

    width:36px;
    height:36px;

  }


  .volumen{

    flex-basis:50px;

    width:50px;

  }


  .tiempo{

    font-size:10px;

  }


  .subtitulos{

    font-size:15px;

  }

}

/* ======================================== */
/* PALETA */
/* ======================================== */

:root{
  --azul:#1d4ed8;
  --naranja:#f97316;
  --blanco:#ffffff;
  --negro:#111827;
}

.tiempo .total{
  color:var(--naranja);
}


/* ======================================== */
/* TRANSCRIPCIÓN */
/* ======================================== */

.transcripcion{
  width:800px;
  max-width:90vw;
  border:2px solid var(--negro);
  border-radius:14px;
  overflow:hidden;
  background:var(--blanco);
}

.transcripcion h2{
  margin:0;
  padding:12px 18px;
  font-size:17px;
  background:var(--azul);
  color:var(--blanco);
}

.lineas{
  max-height:260px;
  overflow-y:auto;
  padding:8px;
}

.linea{
  display:flex;
  gap:12px;
  padding:8px 10px;
  border-radius:8px;
  cursor:pointer;
  line-height:1.4;
  transition:background 0.2s;
}

.linea:hover{
  background:#eff6ff;
}

.linea .marca{
  color:var(--azul);
  font-family:monospace;
  font-weight:bold;
  flex-shrink:0;
}

.linea.activa{
  background:var(--naranja);
  color:var(--blanco);
}

.linea.activa .marca{
  color:var(--negro);
}

.aviso{
  padding:12px 10px;
  color:#6b7280;
}


/* ======================================== */
/* TOAST */
/* ======================================== */

.toast{
  position:fixed;
  bottom:24px;
  right:24px;
  background:var(--negro);
  color:var(--blanco);
  border-left:6px solid var(--naranja);
  border-radius:8px;
  padding:12px 18px;
  box-shadow:0 6px 18px rgba(17,24,39,0.35);
  opacity:0;
  transform:translateY(20px);
  transition:opacity 0.3s, transform 0.3s;
  pointer-events:none;
  z-index:1000;
}

.toast.visible{
  opacity:1;
  transform:translateY(0);
}

.toast strong{
  display:block;
  color:var(--naranja);
  margin-bottom:3px;
}

</style>
</head>

<script>


// ========================================================
// CONVERTIR TIEMPO VTT A SEGUNDOS
// ========================================================

function tiempoASegundos(tiempo){

  let partes =
    tiempo.split(":")


  // ----------------------------------------
  // MM:SS.mmm
  // ----------------------------------------

  if(partes.length == 2){

    let minutos =
      parseInt(partes[0])

    let segundos =
      parseFloat(partes[1])


    return (
      minutos * 60
      +
      segundos
    )

  }


  // ----------------------------------------
  // HH:MM:SS.mmm
  // ----------------------------------------

  if(partes.length == 3){

    let horas =
      parseInt(partes[0])

    let minutos =
      parseInt(partes[1])

    let segundos =
      parseFloat(partes[2])


    return (
      horas * 3600
      +
      minutos * 60
      +
      segundos
    )

  }


  return 0

}



// ========================================================
// BUSCAR TODOS LOS AUDIOS
// ========================================================

// ========================================
// TOAST
// ========================================

let toast = document.createElement("div")
toast.classList.add("toast")
document.body.appendChild(toast)
let temporizadorToast

function mostrarToast(boton, mensaje){
  toast.innerHTML = "<strong>" + boton + "</strong>Mensaje: " + mensaje
  toast.classList.add("visible")
  clearTimeout(temporizadorToast)
  temporizadorToast = setTimeout(function(){
    toast.classList.remove("visible")
  }, 2500)
}



// ========================================
// TRANSCRIPCIÓN (archivo WebVTT)
// ========================================

// "00:01:02.500" o "01:02.500" -> segundos
function aSegundos(marca){
  let partes = marca.trim().replace(",", ".").split(":").map(Number)
  let segundos = 0
  partes.forEach(function(p){ segundos = segundos * 60 + p })
  return segundos
}

// segundos -> m:ss
function marcaCorta(segundos){
  let m = Math.floor(segundos / 60)
  let s = Math.floor(segundos % 60)
  return m + ":" + String(s).padStart(2, "0")
}

/*
  Crea un panel debajo del reproductor y carga
  el .vtt con el mismo nombre que el audio
  (0802.mp3 -> 0802.vtt).
*/
function crearTranscripcion(audio, despuesDe){

  let panel = document.createElement("div")
  panel.classList.add("transcripcion")
  panel.innerHTML =
    '<h2>Transcripción</h2>' +
    '<div class="lineas"><div class="aviso">Cargando transcripción...</div></div>'

  despuesDe.after(panel)

  let lineas = panel.querySelector(".lineas")
  let frases = []

  let rutaVtt = audio.getAttribute("src").replace(/\.[^.]+$/, ".vtt")

  fetch(rutaVtt)
    .then(function(respuesta){
      if(!respuesta.ok) throw new Error("No existe")
      return respuesta.text()
    })
    .then(function(texto){

      // Cada bloque separado por una línea en blanco es una frase
      let bloques = texto.replace(/\r/g, "").split(/\n\n+/)

      bloques.forEach(function(bloque){
        let filas = bloque.split("\n")
        let indice = filas.findIndex(f => f.includes("-->"))
        if(indice === -1) return

        let tiempos = filas[indice].split("-->")
        frases.push({
          inicio: aSegundos(tiempos[0]),
          fin: aSegundos(tiempos[1].trim().split(" ")[0]),
          texto: filas.slice(indice + 1).join(" ")
        })
      })

      lineas.innerHTML = ""

      frases.forEach(function(frase){

        let linea = document.createElement("div")
        linea.classList.add("linea")

        let marca = document.createElement("span")
        marca.classList.add("marca")
        marca.textContent = marcaCorta(frase.inicio)

        let textoFrase = document.createElement("span")
        textoFrase.textContent = frase.texto

        linea.appendChild(marca)
        linea.appendChild(textoFrase)
        lineas.appendChild(linea)

        // Clic en una frase = saltar a ese momento
        linea.addEventListener("click", function(){
          audio.currentTime = frase.inicio
          mostrarToast("Transcripción", "Saltando a " + marcaCorta(frase.inicio))
        })

        frase.elemento = linea
      })
    })
    .catch(function(){
      lineas.innerHTML = '<div class="aviso">No se ha encontrado la transcripción (' + rutaVtt + ').</div>'
    })


  // Resaltar la frase que está sonando
  audio.addEventListener("timeupdate", function(){

    frases.forEach(function(frase){

      let activa = audio.currentTime >= frase.inicio && audio.currentTime < frase.fin

      if(activa && !frase.elemento.classList.contains("activa")){
        frase.elemento.classList.add("activa")
        lineas.scrollTop = frase.elemento.offsetTop - lineas.offsetTop - lineas.clientHeight / 2
      }

      if(!activa){
        frase.elemento.classList.remove("activa")
      }
    })
  })
}



let audios = document.querySelectorAll("audio")



audios.forEach(function(audio){


  // ======================================================
  // CONTENEDOR
  // ======================================================

  let contenedor =
    document.createElement("div")


  contenedor.classList.add(
    "jvaudio"
  )


  audio.parentNode.insertBefore(
    contenedor,
    audio
  )


  contenedor.appendChild(
    audio
  )


  // Panel de transcripción debajo del reproductor

  crearTranscripcion(audio, contenedor)



  // ======================================================
  // ATRÁS
  // ======================================================

  let atras =
    document.createElement("button")


  atras.textContent =
    "↶"


  atras.title =
    "Retroceder 5 segundos"


  contenedor.appendChild(
    atras
  )



  // ======================================================
  // PLAY
  // ======================================================

  let reproducir =
    document.createElement("button")


  reproducir.textContent =
    "▶"


  reproducir.title =
    "Reproducir"


  contenedor.appendChild(
    reproducir
  )



  // ======================================================
  // ADELANTE
  // ======================================================

  let adelante =
    document.createElement("button")


  adelante.textContent =
    "↷"


  adelante.title =
    "Avanzar 5 segundos"


  contenedor.appendChild(
    adelante
  )



  // ======================================================
  // BOTÓN SUBTÍTULOS
  // ======================================================

  let botonSubtitulos =
    document.createElement("button")


  botonSubtitulos.textContent =
    "CC"


  botonSubtitulos.title =
    "Desactivar subtítulos"


  botonSubtitulos.classList.add(
    "boton-subtitulos"
  )


  botonSubtitulos.classList.add(
    "activo"
  )


  contenedor.appendChild(
    botonSubtitulos
  )



  // ======================================================
  // TIEMPO
  // ======================================================

  let tiempo =
    document.createElement("div")


  tiempo.classList.add(
    "tiempo"
  )


  tiempo.innerHTML =
    '0:00 / <span class="total">0:00</span>'


  contenedor.appendChild(
    tiempo
  )



  // ======================================================
  // CANVAS
  // ======================================================

  let canvas =
    document.createElement("canvas")


  canvas.height =
    80


  canvas.classList.add(
    "waveform"
  )


  contenedor.appendChild(
    canvas
  )


  let ctx =
    canvas.getContext("2d")



  // ======================================================
  // VOLUMEN
  // ======================================================

  let volumen =
    document.createElement("input")


  volumen.type =
    "range"


  volumen.min =
    0


  volumen.max =
    1


  volumen.step =
    0.01


  volumen.value =
    1


  volumen.classList.add(
    "volumen"
  )


  contenedor.appendChild(
    volumen
  )



  // ======================================================
  // CONTENEDOR SUBTÍTULOS
  // ======================================================

  let contenedorSubtitulos =
    document.createElement("div")


  contenedorSubtitulos.classList.add(
    "subtitulos"
  )


  contenedor.appendChild(
    contenedorSubtitulos
  )



  // ======================================================
  // TIEMPO ACTUAL / DURACIÓN
  // ======================================================

  function actualizarTiempo(){

    let total = audio.duration
      ? formatearTiempo(audio.duration)
      : "0:00"

    tiempo.innerHTML =
      formatearTiempo(audio.currentTime) +
      ' / <span class="total">' + total + '</span>'

  }


  audio.addEventListener("loadedmetadata", actualizarTiempo)



  // ======================================================
  // TOASTS
  // ======================================================

  /*
    Se registran antes que los onclick de abajo,
    así que se ejecutan primero: audio.paused y
    subtitulosActivos todavía tienen el valor
    de ANTES del clic.
  */

  reproducir.addEventListener("click", function(){
    if(audio.paused){
      mostrarToast("Reproducir", "El audio se está reproduciendo...")
    }else{
      mostrarToast("Pausar", "El audio se ha pausado.")
    }
  })

  adelante.addEventListener("click", function(){
    mostrarToast("Avanzar", "Avanzando 5 segundos...")
  })

  atras.addEventListener("click", function(){
    mostrarToast("Retroceder", "Retrocediendo 5 segundos...")
  })

  botonSubtitulos.addEventListener("click", function(){
    if(subtitulosActivos){
      mostrarToast("Subtítulos", "Subtítulos desactivados.")
    }else{
      mostrarToast("Subtítulos", "Subtítulos activados.")
    }
  })

  canvas.addEventListener("click", function(){
    mostrarToast("Onda", "Saltando a " + formatearTiempo(audio.currentTime))
  })



  // ======================================================
  // CONFIGURACIÓN
  // ======================================================

  let numeroBarras =
    90


  let canales =
    []


  let esEstereo =
    false


  let subtitulosActivos =
    true


  let subtitulosDisponibles =
    false


  let transcripcion =
    []



  // ======================================================
  // CALCULAR NOMBRE DEL VTT
  // ======================================================

  let origenAudio =
    audio.getAttribute("src")


  let posicionPunto =
    origenAudio.lastIndexOf(".")


  let nombreAudio


  if(posicionPunto !== -1){

    nombreAudio =
      origenAudio.substring(
        0,
        posicionPunto
      )

  }else{

    nombreAudio =
      origenAudio

  }


  let nombreTranscripcion =
    nombreAudio + ".vtt"



  console.log(

    "Buscando subtítulos:",

    nombreTranscripcion

  )



  // ======================================================
  // CARGAR VTT
  // ======================================================

  fetch(nombreTranscripcion)

  .then(function(resultado){


    if(!resultado.ok){

      throw new Error(
        "No existe el archivo VTT"
      )

    }


    return resultado.text()

  })


  .then(function(datos){


    // --------------------------------------
    // LIMPIAR RETORNOS
    // --------------------------------------

    datos =
      datos.replace(
        /\r/g,
        ""
      )



    // --------------------------------------
    // DIVIDIR EN BLOQUES
    // --------------------------------------

    let bloques =
      datos.split(
        /\n\n+/
      )



    bloques.forEach(
      function(bloque){


        let lineas =
          bloque
          .trim()
          .split("\n")



        if(lineas.length < 2){

          return

        }



        // ----------------------------------
        // BUSCAR -->
        // ----------------------------------

        let lineaTiempo =
          -1


        for(
          let i = 0;
          i < lineas.length;
          i++
        ){

          if(
            lineas[i].includes("-->")
          ){

            lineaTiempo =
              i

            break

          }

        }



        if(lineaTiempo == -1){

          return

        }



        // ----------------------------------
        // SEPARAR INICIO / FINAL
        // ----------------------------------

        let tiempos =
          lineas[lineaTiempo]
          .split(
            /\s+-->\s+/
          )



        if(tiempos.length != 2){

          return

        }



        let inicio =
          tiempos[0].trim()



        let final =
          tiempos[1]
          .trim()
          .split(/\s+/)[0]



        // ----------------------------------
        // TEXTO
        // ----------------------------------

        let texto =
          lineas
          .slice(
            lineaTiempo + 1
          )
          .join(" ")
          .trim()



        if(texto == ""){

          return

        }



        // ----------------------------------
        // GUARDAR
        // ----------------------------------

        transcripcion.push({

          inicio:
            tiempoASegundos(
              inicio
            ),

          final:
            tiempoASegundos(
              final
            ),

          texto:
            texto

        })


      }

    )



    // --------------------------------------
    // ORDENAR
    // --------------------------------------

    transcripcion.sort(
      function(a,b){

        return (
          a.inicio -
          b.inicio
        )

      }
    )



    subtitulosDisponibles =
      transcripcion.length > 0



    console.log(
      "Subtítulos cargados:",
      transcripcion
    )



    // --------------------------------------
    // SI NO HAY SUBTÍTULOS
    // --------------------------------------

    if(!subtitulosDisponibles){

      botonSubtitulos.style.display =
        "none"

      contenedorSubtitulos.style.display =
        "none"

      return

    }



    // --------------------------------------
    // ACTIVADOS POR DEFECTO
    // --------------------------------------

    subtitulosActivos =
      true


    botonSubtitulos.classList.add(
      "activo"
    )


    botonSubtitulos.title =
      "Desactivar subtítulos"



    actualizarSubtitulos()


  })


  .catch(function(error){


    console.log(

      "No se pudieron cargar subtítulos:",

      nombreTranscripcion

    )


    console.log(error)



    botonSubtitulos.style.display =
      "none"


    contenedorSubtitulos.style.display =
      "none"


  })



  // ======================================================
  // BOTÓN CC
  // ======================================================

  botonSubtitulos.onclick =
  function(){


    if(!subtitulosDisponibles){

      return

    }



    subtitulosActivos =
      !subtitulosActivos



    if(subtitulosActivos){


      botonSubtitulos.classList.add(
        "activo"
      )


      botonSubtitulos.title =
        "Desactivar subtítulos"


      actualizarSubtitulos()


    }else{


      botonSubtitulos.classList.remove(
        "activo"
      )


      botonSubtitulos.title =
        "Activar subtítulos"


      contenedorSubtitulos.textContent =
        ""


    }


  }



  // ======================================================
  // ACTUALIZAR SUBTÍTULOS
  // ======================================================

  function actualizarSubtitulos(){


    if(
      !subtitulosActivos
      ||
      !subtitulosDisponibles
    ){

      contenedorSubtitulos.textContent =
        ""

      return

    }



    let tiempoActual =
      audio.currentTime



    let textoActual =
      ""



    for(
      let i = 0;
      i < transcripcion.length;
      i++
    ){


      let frase =
        transcripcion[i]



      if(
        tiempoActual >= frase.inicio
        &&
        tiempoActual <= frase.final
      ){

        textoActual =
          frase.texto

        break

      }


    }



    contenedorSubtitulos.textContent =
      textoActual

  }



  // ======================================================
  // CARGAR AUDIO PARA WAVEFORM
  // ======================================================

  fetch(audio.src)

  .then(function(respuesta){

    return respuesta.arrayBuffer()

  })

  .then(function(datos){


    let contextoAudio =
      new AudioContext()



    contextoAudio.decodeAudioData(

      datos,

      function(buffer){


        // ----------------------------------
        // DETECTAR CANALES
        // ----------------------------------

        esEstereo =
          buffer.numberOfChannels === 2



        let numeroCanales =
          esEstereo ? 2 : 1



        for(
          let canal = 0;
          canal < numeroCanales;
          canal++
        ){


          let samples =
            buffer.getChannelData(
              canal
            )



          canales.push(

            calcularWaveform(
              samples
            )

          )


        }



        dibujar()


      }

    )


  })



  // ======================================================
  // CALCULAR WAVEFORM
  // ======================================================

  function calcularWaveform(samples){


    let alturas =
      []



    let salto =
      Math.floor(

        samples.length /
        numeroBarras

      )



    for(
      let barra = 0;
      barra < numeroBarras;
      barra++
    ){


      let maximo =
        0



      let inicio =
        barra * salto



      let final =
        Math.min(

          inicio + salto,

          samples.length

        )



      let subSalto =
        Math.max(

          1,

          Math.floor(
            salto / 100
          )

        )



      for(
        let i = inicio;
        i < final;
        i += subSalto
      ){


        let valor =
          Math.abs(
            samples[i]
          )



        if(valor > maximo){

          maximo =
            valor

        }


      }



      alturas.push(
        maximo
      )


    }



    return alturas

  }



  // ======================================================
  // DIBUJAR WAVEFORM
  // ======================================================

  function dibujar(){


    if(canales.length === 0){

      return

    }



    let anchoReal =
      Math.floor(
        canvas.clientWidth
      )



    if(anchoReal <= 0){

      return

    }



    if(canvas.width !== anchoReal){

      canvas.width =
        anchoReal

    }



    let ancho =
      canvas.width


    let alto =
      canvas.height



    ctx.clearRect(

      0,
      0,
      ancho,
      alto

    )



    // --------------------------------------
    // PROGRESO
    // --------------------------------------

    let progreso =
      0



    if(
      audio.duration
      &&
      !isNaN(audio.duration)
    ){

      progreso =
        audio.currentTime /
        audio.duration

    }



    // --------------------------------------
    // BARRAS
    // --------------------------------------

    let separacion =
      3



    let anchoBarra =
      (
        ancho
        -
        separacion *
        (numeroBarras - 1)
      )
      /
      numeroBarras



    if(anchoBarra < 1){


      separacion =
        1



      anchoBarra =
        (
          ancho
          -
          separacion *
          (numeroBarras - 1)
        )
        /
        numeroBarras


    }



    let barraActual =
      progreso *
      (numeroBarras - 1)



    // --------------------------------------
    // MONO
    // --------------------------------------

    if(!esEstereo){


      dibujarMono(

        canales[0],

        anchoBarra,

        separacion,

        barraActual

      )


    }

    // --------------------------------------
    // ESTÉREO
    // --------------------------------------

    else{


      dibujarEstereo(

        canales[0],

        canales[1],

        anchoBarra,

        separacion,

        barraActual

      )


    }


  }



  // ======================================================
  // DIBUJAR MONO
  // ======================================================

  function dibujarMono(

    alturas,

    anchoBarra,

    separacion,

    barraActual

  ){


    let alto =
      canvas.height



    let medio =
      alto / 2



    for(
      let i = 0;
      i < alturas.length;
      i++
    ){


      let altura =
        alturas[i]
        *
        medio
        *
        0.85



      altura =
        Math.max(
          altura,
          3
        )



      let x =
        i
        *
        (
          anchoBarra
          +
          separacion
        )



      ctx.fillStyle =
        obtenerColor(
          i,
          barraActual
        )



      ctx.beginPath()



      ctx.roundRect(

        x,

        medio - altura,

        Math.max(
          1,
          anchoBarra
        ),

        altura * 2,

        Math.max(
          1,
          anchoBarra
        ) / 2

      )



      ctx.fill()


    }


  }



  // ======================================================
  // DIBUJAR ESTÉREO
  // ======================================================

  function dibujarEstereo(

    izquierdo,

    derecho,

    anchoBarra,

    separacion,

    barraActual

  ){


    let alto =
      canvas.height



    let separacionCentral =
      4



    let alturaCanal =
      (
        alto
        -
        separacionCentral
      )
      /
      2



    let centroSuperior =
      alturaCanal / 2



    let centroInferior =
      alturaCanal
      +
      separacionCentral
      +
      alturaCanal / 2



    dibujarCanal(

      izquierdo,

      centroSuperior,

      alturaCanal,

      anchoBarra,

      separacion,

      barraActual

    )



    dibujarCanal(

      derecho,

      centroInferior,

      alturaCanal,

      anchoBarra,

      separacion,

      barraActual

    )


  }



  // ======================================================
  // DIBUJAR CANAL
  // ======================================================

  function dibujarCanal(

    alturas,

    centro,

    alturaDisponible,

    anchoBarra,

    separacion,

    barraActual

  ){


    for(
      let i = 0;
      i < alturas.length;
      i++
    ){


      let altura =
        alturas[i]
        *
        alturaDisponible
        *
        0.40



      altura =
        Math.max(
          altura,
          2
        )



      let x =
        i
        *
        (
          anchoBarra
          +
          separacion
        )



      ctx.fillStyle =
        obtenerColor(
          i,
          barraActual
        )



      ctx.beginPath()



      ctx.roundRect(

        x,

        centro - altura,

        Math.max(
          1,
          anchoBarra
        ),

        altura * 2,

        Math.max(
          1,
          anchoBarra
        ) / 2

      )



      ctx.fill()


    }


  }



  // ======================================================
  // COLOR DEL WAVEFORM
  // ======================================================

  function obtenerColor(
    barra,
    barraActual
  ){

    /*
      Colores de la paleta en RGB:

      azul    #1d4ed8 -> todavía no reproducido
      naranja #f97316 -> punto actual
    */

    let azul = [29, 78, 216]

    let naranja = [249, 115, 22]



    // ========================================
    // FUTURO
    // ========================================

    if(barra > barraActual){

      return "rgb(" + azul.join(",") + ")"

    }



    // ========================================
    // PASADO
    // ========================================

    /*
      Distancia de esta barra respecto
      al punto actual.
    */

    let distancia =
      barraActual -
      barra



    /*
      Número de barras durante las que
      el naranja se va convirtiendo en azul.

      Puedes modificar este valor.

      15 = degradado corto
      30 = degradado medio
      60 = degradado largo
    */

    let distanciaDegradado = 35



    let intensidad =
      1 -
      (
        distancia /
        distanciaDegradado
      )


    intensidad =
      Math.max(
        0,
        Math.min(
          1,
          intensidad
        )
      )



    /*
      intensidad = 1
      naranja

      intensidad = 0
      azul
    */

    let color = azul.map(function(valor, i){

      return Math.round(
        valor +
        (naranja[i] - valor) * intensidad
      )

    })


    return "rgb(" + color.join(",") + ")"

  }



  // ======================================================
  // PLAY / PAUSE
  // ======================================================

  reproducir.onclick =
  function(){


    if(audio.paused){

      audio.play()

    }else{

      audio.pause()

    }


  }



  audio.onplay =
  function(){

    reproducir.textContent =
      "❚❚"

  }



  audio.onpause =
  function(){

    reproducir.textContent =
      "▶"

  }



  audio.onended =
  function(){

    reproducir.textContent =
      "▶"

  }



  // ======================================================
  // ADELANTE 5 SEGUNDOS
  // ======================================================

  adelante.onclick =
  function(){


    if(!audio.duration){

      return

    }



    audio.currentTime =
      Math.min(

        audio.currentTime + 5,

        audio.duration

      )



    actualizarSubtitulos()


  }



  // ======================================================
  // ATRÁS 5 SEGUNDOS
  // ======================================================

  atras.onclick =
  function(){


    audio.currentTime =
      Math.max(

        audio.currentTime - 5,

        0

      )



    actualizarSubtitulos()


  }



  // ======================================================
  // VOLUMEN
  // ======================================================

  volumen.oninput =
  function(){


    audio.volume =
      this.value


  }



  // ======================================================
  // ACTUALIZACIÓN DEL AUDIO
  // ======================================================

  audio.ontimeupdate =
  function(){


    // --------------------------------------
    // WAVEFORM
    // --------------------------------------

    dibujar()



    // --------------------------------------
    // TIEMPO
    // --------------------------------------

    actualizarTiempo()



    // --------------------------------------
    // SUBTÍTULOS
    // --------------------------------------

    actualizarSubtitulos()


  }



  // ======================================================
  // CLICK EN WAVEFORM
  // ======================================================

  canvas.onclick =
  function(evento){


    cambiarPosicion(
      evento
    )


  }



  // ======================================================
  // ARRASTRAR WAVEFORM
  // ======================================================

  let arrastrando =
    false



  canvas.onmousedown =
  function(evento){


    arrastrando =
      true


    cambiarPosicion(
      evento
    )


  }



  window.addEventListener(

    "mousemove",

    function(evento){


      if(arrastrando){


        cambiarPosicion(
          evento
        )


      }


    }

  )



  window.addEventListener(

    "mouseup",

    function(){


      arrastrando =
        false


    }

  )



  // ======================================================
  // CAMBIAR POSICIÓN
  // ======================================================

  function cambiarPosicion(evento){


    if(
      !audio.duration
      ||
      isNaN(audio.duration)
    ){

      return

    }



    let rect =
      canvas.getBoundingClientRect()



    let x =
      evento.clientX
      -
      rect.left



    x =
      Math.max(

        0,

        Math.min(
          x,
          rect.width
        )

      )



    let porcentaje =
      x
      /
      rect.width



    audio.currentTime =
      porcentaje
      *
      audio.duration



    dibujar()


    actualizarSubtitulos()


  }



  // ======================================================
  // FORMATEAR TIEMPO
  // ======================================================

  function formatearTiempo(segundos){


    if(isNaN(segundos)){

      return "0:00"

    }



    let minutos =
      Math.floor(
        segundos / 60
      )



    let resto =
      Math.floor(
        segundos % 60
      )



    if(resto < 10){

      resto =
        "0" + resto

    }



    return (
      minutos
      +
      ":"
      +
      resto
    )


  }



  // ======================================================
  // REDIMENSIONAR
  // ======================================================

  window.addEventListener(

    "resize",

    function(){


      dibujar()


    }

  )


})

</script>
