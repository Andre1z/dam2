<!doctype html>
<html>
  <head>
    <style>
      html,body{padding:0px;margin:0px;width:100%;height:100%;}
      #contenedor{padding:10px;}
      nav{position:fixed;bottom:0px;width:100%;display:flex;
        justify-content:center;gap:10px;
      }
      nav button{width:100%;height:50px;}
    /* paleta-andrei */:root{--naranja:#f97316;--azul:#1d4ed8;--azul-medio:#1e40af;--azul-claro:#eff6ff;--azul-palido:#dbeafe;--blanco:#ffffff;--negro:#111827;--radio:12px}:where(button,input,select,textarea,fieldset,img,video,canvas,iframe,table,pre,dialog,details,article,section,aside,nav a,[class*="card"],[class*="tarjeta"],[class*="panel"],[class*="caja"],[class*="boton"],[class*="btn"],[class*="widget"],[class*="modal"]){border-radius:var(--radio)}</style>
  </head>
  <body>
    <div id="contenedor">
      
    </div>
    <nav>
      <button data-url="pantalla1">Pantalla 1</button>
      <button data-url="pantalla2">Pantalla 2</button>
      <button data-url="pantalla3">Pantalla 3</button>
      <button data-url="pantalla4">Pantalla 4</button>
    </nav>
    <script>
      let contenedor = document.querySelector("#contenedor")
      let botones = document.querySelectorAll("button")
      botones.forEach(function(boton){
      	boton.onclick = function(){
          fetch("vistas/"+this.getAttribute("data-url")+".html")
          .then(function(resultado){return resultado.text()})
          .then(function(datos){
            contenedor.innerHTML = datos
          })
        }
      })
    </script>
  </body>
</html>
