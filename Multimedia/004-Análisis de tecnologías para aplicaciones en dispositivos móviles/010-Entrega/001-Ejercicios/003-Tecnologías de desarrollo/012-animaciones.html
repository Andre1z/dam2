<style>
  div{
  	width:100px;
    height:100px;
    background:#f97316;
    animation:muevemueve 10s;

  @keyframes muevemueve{
    0%{left:0px;top:0px;}
    25%{left:100px;top:0px;}

    75%{left:0px;top:100px;}

  }
