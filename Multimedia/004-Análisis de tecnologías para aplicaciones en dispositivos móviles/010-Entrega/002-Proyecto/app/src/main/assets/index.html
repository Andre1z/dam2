<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <meta
            name="theme-color"
            content="#1d4ed8"
    >

    <title>Andrei - CRM (Móvil)</title>

    <link
            rel="stylesheet"
            href="estilo.css?v=1"
    >

</head>

<body>

<header class="app-header">

    <div class="app-brand">

        <div class="app-logo">
            CRM
        </div>

        <div class="app-info">

            <strong>
                Andrei - CRM
            </strong>

            <small>
                Gestión empresarial móvil
            </small>

        </div>

    </div>

</header>

<main id="contenedor">

    <!-- Las vistas se cargan aquí -->

</main>

<nav
        class="navegacion-principal"
        aria-label="Navegación principal"
>

    <button
            type="button"
            data-url="inicio"
    >
        <span class="nav-icon">🏠</span>
        <span>Inicio</span>
    </button>

    <button
            type="button"
            data-url="clientes"
    >
        <span class="nav-icon">👥</span>
        <span>Clientes</span>
    </button>

    <button
            type="button"
            data-url="empresas"
    >
        <span class="nav-icon">🏢</span>
        <span>Empresas</span>
    </button>

    <button
            type="button"
            data-url="tareas"
    >
        <span class="nav-icon">✅</span>
        <span>Tareas</span>
    </button>

    <button
            type="button"
            data-url="informes"
    >
        <span class="nav-icon">📊</span>
        <span>Informes</span>
    </button>

    <button
            type="button"
            data-url="mas"
    >
        <span class="nav-icon">☰</span>
        <span>Más</span>
    </button>

</nav>

<script src="componentes.js?v=1"></script>
<script src="controlador.js?v=1"></script>

</body>

</html>
