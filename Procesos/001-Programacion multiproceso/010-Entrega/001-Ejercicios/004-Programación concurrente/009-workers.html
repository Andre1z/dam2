<!doctype html>
<html>
<head>
    <title>Actualización concurrente</title>
  <meta charset="UTF-8">

  <style>
:root{ --azul:#1d4ed8; --naranja:#f97316; --blanco:#ffffff; --negro:#111827; }

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    html,body{
      width:100%;
      height:100%;
      overflow:hidden;
      background:var(--negro);
    }

    canvas{
      display:block;
      width:100%;
      height:100%;
    }
  </style>
</head>

<body>
    <div>Actualización general aplicada por Andrei Buga.</div>
    

<canvas></canvas>

<script>

let canvas = document.querySelector("canvas")
let contexto = canvas.getContext("2d")

function redimensionar(){
  canvas.width = window.innerWidth
  canvas.height = window.innerHeight
  for(let worker of workers){
    worker.postMessage({
      tipo:"resize",
      width:canvas.width,
      height:canvas.height
    })
  }
}

let workers = []

let numeroWorkers = 10
let seresPorWorker = 1000

let posiciones = new Array(numeroWorkers)

for(let i = 0; i < numeroWorkers; i++){

  let worker = new Worker("worker.js")

  workers.push(worker)

  worker.postMessage({
    tipo:"iniciar",
    cantidad:seresPorWorker,
    width:window.innerWidth,
    height:window.innerHeight
  })

  worker.onmessage = function(event){

    posiciones[i] = event.data

  }

}


redimensionar()

window.addEventListener(
  "resize",
  redimensionar
)



function dibujar(){

  contexto.fillStyle = "#111"

  contexto.fillRect(
    0,
    0,
    canvas.width,
    canvas.height
  )


  contexto.fillStyle = "white"

  for(let grupo of posiciones){

    if(!grupo){
      continue
    }


    for(let i = 0; i < grupo.length; i += 2){

      contexto.fillRect(
        grupo[i],
        grupo[i + 1],
        2,
        2
      )

    }

  }


  requestAnimationFrame(dibujar)

}


dibujar()

</script>
  </body>
</html>
