<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Luz 2D - BRDF + ReflexiÃ³n difusa</title>

<style>
:root{ --azul:#1d4ed8; --naranja:#f97316; --blanco:#ffffff; --negro:#111827; }

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--negro);
}

canvas{
    display:block;
    width:100%;
    height:100%;
    cursor:crosshair;
}
</style>
</head>

<body>
    <div>Actualización general aplicada por Andrei Buga.</div>
    

<canvas></canvas>

<script>

const canvas = document.querySelector("canvas");
const ctx = canvas.getContext("2d");

let W;
let H;

const raton = {
    x:400,
    y:300
};
const NUM_RAYOS = 1800;
const MAX_REBOTES = 7;
const MAX_DISTANCIA = 4000;
const INTENSIDAD_MINIMA = 0.008;
const REFLECTANCIA = 0.82;
const ESPECULAR = 0.18;
const DIFUSA = 0.82;
const RUGOSIDAD = 0.78;
const RAYOS_DIFUSOS = 5;
const MAX_REBOTES_DIFUSOS = 15;

function redimensionar(){

    const dpr = window.devicePixelRatio || 1;

    W = window.innerWidth;
    H = window.innerHeight;

    canvas.width = W*dpr;
    canvas.height = H*dpr;

    canvas.style.width = W+"px";
    canvas.style.height = H+"px";

    ctx.setTransform(
        dpr,0,
        0,dpr,
        0,0
    );
}

window.addEventListener(
    "resize",
    function(){

        redimensionar();
        crearLaberinto();

    }
);

redimensionar();

canvas.addEventListener(
    "mousemove",
    function(e){

        const rect =
            canvas.getBoundingClientRect();

        raton.x =
            e.clientX - rect.left;

        raton.y =
            e.clientY - rect.top;

    }
);

let muros = [];

function muro(x1,y1,x2,y2){

    muros.push({
        x1:x1,
        y1:y1,
        x2:x2,
        y2:y2
    });

}

function crearLaberinto(){

    muros = [];

    const m = 25;

    muro(
        m,m,
        W-m,m
    );

    muro(
        W-m,m,
        W-m,H-m
    );

    muro(
        W-m,H-m,
        m,H-m
    );

    muro(
        m,H-m,
        m,m
    );

    muro(
        W*0.27,
        H*0.10,
        W*0.27,
        H*0.43
    );

    muro(
        W*0.27,
        H*0.65,
        W*0.27,
        H*0.90
    );

    muro(
        W*0.50,
        H*0.23,
        W*0.50,
        H*0.70
    );

    muro(
        W*0.74,
        H*0.10,
        W*0.74,
        H*0.36
    );

    muro(
        W*0.74,
        H*0.58,
        W*0.74,
        H*0.90
    );

    muro(
        W*0.07,
        H*0.28,
        W*0.18,
        H*0.28
    );


    muro(
        W*0.35,
        H*0.17,
        W*0.64,
        H*0.17
    );


    muro(
        W*0.34,
        H*0.52,
        W*0.44,
        H*0.52
    );


    muro(
        W*0.58,
        H*0.43,
        W*0.89,
        H*0.43
    );


    muro(
        W*0.08,
        H*0.77,
        W*0.42,
        H*0.77
    );


    muro(
        W*0.58,
        H*0.79,
        W*0.89,
        H*0.79
    );

}

crearLaberinto();

function interseccionRayoSegmento(
    px,
    py,
    dx,
    dy,
    m
){

    const sx =
        m.x2-m.x1;

    const sy =
        m.y2-m.y1;

    const denominador =
        dx*sy -
        dy*sx;

    if(
        Math.abs(denominador)
        < 0.000001
    ){
        return null;
    }


    const qpx =
        m.x1-px;

    const qpy =
        m.y1-py;


    const t =
        (
            qpx*sy -
            qpy*sx
        )
        /
        denominador;


    const u =
        (
            qpx*dy -
            qpy*dx
        )
        /
        denominador;


    if(
        t > 0.001 &&
        u >= 0 &&
        u <= 1
    ){

        return {

            x:
                px +
                dx*t,

            y:
                py +
                dy*t,

            distancia:t,

            muro:m

        };

    }

    return null;

}

function primerImpacto(
    x,
    y,
    dx,
    dy
){

    let mejor = null;

    for(const m of muros){

        const impacto =
            interseccionRayoSegmento(
                x,
                y,
                dx,
                dy,
                m
            );

        if(
            impacto &&
            (
                mejor === null ||
                impacto.distancia
                <
                mejor.distancia
            )
        ){

            mejor = impacto;

        }

    }

    return mejor;

}

function normalMuro(
    m,
    dx,
    dy
){

    let wx =
        m.x2 -
        m.x1;

    let wy =
        m.y2 -
        m.y1;

    const longitud =
        Math.hypot(
            wx,
            wy
        );

    wx /= longitud;
    wy /= longitud;

    let nx = -wy;
    let ny = wx;

    if(
        dx*nx +
        dy*ny
        >
        0
    ){

        nx = -nx;
        ny = -ny;

    }


    return {
        x:nx,
        y:ny
    };

}

function reflejar(
    dx,
    dy,
    normal
){

    const dot =
        dx*normal.x +
        dy*normal.y;


    let rx =
        dx -
        2*dot*normal.x;

    let ry =
        dy -
        2*dot*normal.y;


    const l =
        Math.hypot(
            rx,
            ry
        );


    return {

        x:rx/l,
        y:ry/l

    };

}

function direccionDifusa(
    normal
){

    const anguloNormal =
        Math.atan2(
            normal.y,
            normal.x
        );

    const random =
        Math.random()*2-1;

    let desviacion =
        Math.asin(random);

    desviacion *=
        RUGOSIDAD;


    const angulo =
        anguloNormal +
        desviacion;


    return {

        x:
            Math.cos(angulo),

        y:
            Math.sin(angulo)

    };

}

function aplicarRugosidad(
    direccion
){

    let angulo =
        Math.atan2(
            direccion.y,
            direccion.x
        );


    angulo +=
        (
            Math.random()-0.5
        )
        *
        RUGOSIDAD
        *
        0.35;


    return {

        x:
            Math.cos(angulo),

        y:
            Math.sin(angulo)

    };

}

function pintarSegmento(
    x1,
    y1,
    x2,
    y2,
    intensidad
){

    if(intensidad <= 0){
        return;
    }

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );


    ctx.strokeStyle =
        `rgba(
            255,
            150,
            30,
            ${0.018*intensidad}
        )`;

    ctx.lineWidth =
        7*intensidad;

    ctx.stroke();

    ctx.beginPath();

    ctx.moveTo(
        x1,
        y1
    );

    ctx.lineTo(
        x2,
        y2
    );


    ctx.strokeStyle =
        `rgba(
            255,
            230,
            150,
            ${0.09*intensidad}
        )`;

    ctx.lineWidth =
        0.5 +
        intensidad;

    ctx.stroke();

}

function lanzarRayo(
    x,
    y,
    dx,
    dy,
    intensidad,
    rebote,
    permitirDifusion
){

    if(
        intensidad <
        INTENSIDAD_MINIMA
    ){
        return;
    }


    if(
        rebote >
        MAX_REBOTES
    ){
        return;
    }


    const impacto =
        primerImpacto(
            x,
            y,
            dx,
            dy
        );

    if(!impacto){

        pintarSegmento(

            x,
            y,

            x +
            dx*MAX_DISTANCIA,

            y +
            dy*MAX_DISTANCIA,

            intensidad

        );

        return;

    }

    pintarSegmento(

        x,
        y,

        impacto.x,
        impacto.y,

        intensidad

    );

    const normal =
        normalMuro(
            impacto.muro,
            dx,
            dy
        );

    const cosIncidencia =
        Math.max(
            0,
            -(dx*normal.x + dy*normal.y)
        );

    let direccionEspecular =
        reflejar(
            dx,
            dy,
            normal
        );


    direccionEspecular =
        aplicarRugosidad(
            direccionEspecular
        );

    const fresnel =
        ESPECULAR +
        (1-ESPECULAR)
        *
        Math.pow(
            1-cosIncidencia,
            5
        );


    const energiaEspecular =
        intensidad
        *
        REFLECTANCIA
        *
        fresnel;


    if(
        energiaEspecular >
        INTENSIDAD_MINIMA
    ){

        lanzarRayo(

            impacto.x +
            direccionEspecular.x*0.5,

            impacto.y +
            direccionEspecular.y*0.5,

            direccionEspecular.x,
            direccionEspecular.y,

            energiaEspecular,

            rebote+1,

            permitirDifusion

        );

    }

    if(
        permitirDifusion &&
        rebote <
        MAX_REBOTES_DIFUSOS
    ){

        const energiaDifusaTotal =
            intensidad
            *
            REFLECTANCIA
            *
            DIFUSA
            *
            cosIncidencia;


        const energiaPorRayo =
            energiaDifusaTotal
            /
            RAYOS_DIFUSOS;


        for(
            let i=0;
            i<RAYOS_DIFUSOS;
            i++
        ){

            const direccion =
                direccionDifusa(
                    normal
                );


            if(
                energiaPorRayo
                >
                INTENSIDAD_MINIMA
            ){

                lanzarRayo(

                    impacto.x +
                    direccion.x*0.5,

                    impacto.y +
                    direccion.y*0.5,

                    direccion.x,
                    direccion.y,

                    energiaPorRayo,

                    rebote+1,

                    true

                );

            }

        }

    }

}

function dibujarMuros(){

    ctx.lineCap =
        "round";

    ctx.lineJoin =
        "round";

    ctx.beginPath();

    for(const m of muros){

        ctx.moveTo(
            m.x1,
            m.y1
        );

        ctx.lineTo(
            m.x2,
            m.y2
        );

    }

    ctx.strokeStyle =
        "#000";

    ctx.lineWidth =
        14;

    ctx.stroke();

    ctx.beginPath();

    for(const m of muros){

        ctx.moveTo(
            m.x1,
            m.y1
        );

        ctx.lineTo(
            m.x2,
            m.y2
        );

    }

    ctx.strokeStyle =
        "#3a3a3a";

    ctx.lineWidth =
        7;

    ctx.stroke();

    ctx.beginPath();

    for(const m of muros){

        ctx.moveTo(
            m.x1,
            m.y1
        );

        ctx.lineTo(
            m.x2,
            m.y2
        );

    }

    ctx.strokeStyle =
        "#999";

    ctx.lineWidth =
        2;

    ctx.stroke();

}

function dibujarFuente(){

    const radio = 85;


    const gradiente =
        ctx.createRadialGradient(

            raton.x,
            raton.y,
            0,

            raton.x,
            raton.y,
            radio

        );


    gradiente.addColorStop(
        0,
        "rgba(255,255,255,1)"
    );

    gradiente.addColorStop(
        0.05,
        "rgba(255,255,230,1)"
    );

    gradiente.addColorStop(
        0.18,
        "rgba(255,230,130,0.75)"
    );

    gradiente.addColorStop(
        0.45,
        "rgba(255,170,40,0.25)"
    );

    gradiente.addColorStop(
        1,
        "rgba(255,100,0,0)"
    );


    ctx.beginPath();

    ctx.arc(
        raton.x,
        raton.y,
        radio,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        gradiente;

    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        raton.x,
        raton.y,
        5,
        0,
        Math.PI*2
    );

    ctx.fillStyle =
        "#fff";

    ctx.fill();

}

function emitirLuz(){

    for(
        let i=0;
        i<NUM_RAYOS;
        i++
    ){

        const angulo =
            (
                i /
                NUM_RAYOS
            )
            *
            Math.PI*2
            +
            (
                Math.random()-0.5
            )
            *
            0.003;


        const dx =
            Math.cos(angulo);

        const dy =
            Math.sin(angulo);


        lanzarRayo(

            raton.x,
            raton.y,

            dx,
            dy,

            1,

            0,

            true

        );

    }

}

function animar(){

    ctx.globalCompositeOperation =
        "source-over";

    ctx.fillStyle =
        "#020202";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

    ctx.globalCompositeOperation =
        "lighter";

    emitirLuz();

    ctx.globalCompositeOperation =
        "source-over";

    dibujarMuros();

    ctx.globalCompositeOperation =
        "lighter";

    dibujarFuente();


    ctx.globalCompositeOperation =
        "source-over";


    requestAnimationFrame(
        animar
    );

}

animar();

</script>
  </body>
</html>
