<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Proyecto paralelo</title>
  <style>
    :root{ --azul:#1d4ed8; --naranja:#f97316; --blanco:#ffffff; --negro:#111827; }
    body { background: var(--negro); color: var(--blanco); font-family: Arial, sans-serif; margin: 1.5rem; }
    #identidad { color: var(--naranja); font-weight: bold; margin-bottom: 1rem; }
    #participantes { margin-top: 1rem; }
    .autor { margin-top: 1rem; color: var(--naranja); font-size: 0.9rem; }
  </style>
</head>
<body>

  <div id="identidad">Sin identidad</div>

  <h3>Participantes</h3>
  <div id="participantes"></div>

  <button id="maestro">Soy maestro</button>
  <button id="esclavo">Soy esclavo</button>
  <div class="autor">Andrei Buga</div>

  <script>

    let identidad = null;
    let hash = crypto.randomUUID();

    let botonmaestro = document.querySelector("#maestro");
    let botonesclavo = document.querySelector("#esclavo");

    let contenedor_identidad = document.querySelector("#identidad");
    let contenedor_participantes = document.querySelector("#participantes");

    let temporizador = null;

    botonmaestro.onclick = function () {
      identidad = "maestro";
      contenedor_identidad.textContent = "🟢 Maestro - " + hash + " | Andrei Buga";
      iniciarLatido();
    };

    botonesclavo.onclick = function () {
      identidad = "esclavo";
      contenedor_identidad.textContent = "🔵 Esclavo - " + hash + " | Andrei Buga";
      iniciarLatido();
    };

    function iniciarLatido() {
      if (temporizador) {
        clearTimeout(temporizador);
      }
      latido();
    }

    async function latido() {
      try {
        if (identidad == "esclavo") {
          await fetch("servidor.php", {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              accion: "latido",
              hash: hash,
              autor: "Andrei Buga"
            })
          });
        }

        if (identidad == "maestro") {
          let respuesta = await fetch("servidor.php?accion=participantes");
          let datos = await respuesta.json();
          mostrarParticipantes(datos);
        }
      } catch (error) {
        console.error("Error:", error);
      }

      temporizador = setTimeout(latido, 1000);
    }

    function mostrarParticipantes(datos) {
      contenedor_participantes.innerHTML = "";

      datos.forEach(function (participante) {
        let elemento = document.createElement("div");
        let autor = participante.autor || "Andrei Buga";
        elemento.textContent = "🔵 " + participante.hash + " (" + autor + ")";
        contenedor_participantes.appendChild(elemento);
      });
    }

  </script>

</body>
</html>
