<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horario diario</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:18px;color:#111827;background:#ffffff}header{display:flex;align-items:center;gap:12px;background:#eff6ff;border-left:4px solid #1d4ed8;padding:12px;flex-wrap:wrap}h2{font-size:18px;margin:0 auto 0 0}button,input{padding:7px;border:1px solid #1e40af;border-radius:10px;background:#ffffff;cursor:pointer}button:hover{background:#eff6ff}.wrap{overflow:auto;max-height:80vh}table{border-collapse:collapse;width:100%;table-layout:fixed;background:#ffffff}th,td{border:1px solid #dbeafe;text-align:center;padding:5px;font-size:11px;min-width:28px}th{background:#eff6ff;position:sticky;top:0;z-index:2}td{height:27px;cursor:pointer}td:hover{background:#dbeafe}.today{background:#dbeafe!important}.selected{background:#1d4ed8!important;color:#ffffff}.weekend{background:#eff6ff}.label{min-width:110px;text-align:left;font-weight:bold;position:sticky;left:0;background:#fff;z-index:1}.note{font-size:12px;color:#1e40af;margin-top:12px}/* paleta-andrei */:root{--naranja:#f97316;--azul:#1d4ed8;--azul-medio:#1e40af;--azul-claro:#eff6ff;--azul-palido:#dbeafe;--blanco:#ffffff;--negro:#111827;--radio:12px}:where(button,input,select,textarea,fieldset,img,video,canvas,iframe,table,pre,dialog,details,article,section,aside,nav a,[class*="card"],[class*="tarjeta"],[class*="panel"],[class*="caja"],[class*="boton"],[class*="btn"],[class*="widget"],[class*="modal"]){border-radius:var(--radio)}</style></head><body><header><h2>Horario diario</h2><button id="prev">◀</button><button id="now">Hoy</button><button id="next">▶</button><strong id="period"></strong></header><div class="wrap"><table id="calendar"></table></div><p class="note">Haz clic en una celda para seleccionarla. Las fechas actuales se muestran en verde claro.</p><script>const t=document.getElementById('calendar'),period=document.getElementById('period');let date=new Date(),selected=null;const days=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];const fmt=d=>d.toLocaleDateString('es-ES',{day:'2-digit',month:'2-digit',year:'numeric'});const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=iso(new Date());function cell(tag,text,cls='',key=''){let e=document.createElement(tag);e.textContent=text;e.className=cls;if(key){e.dataset.key=key;if(key===today)e.classList.add('today');if(key===selected)e.classList.add('selected');e.onclick=()=>{selected=key;render()}}return e}function row(...cells){let r=t.insertRow();cells.forEach(c=>r.appendChild(c));return r}function head(labels){let r=t.createTHead().insertRow();labels.forEach(x=>r.appendChild(cell('th',x)))}document.getElementById('now').onclick=()=>{date=new Date();render()};function render(){t.innerHTML='';period.textContent=date.toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long',year:'numeric'});head(['Hora','Actividad / anotaciones']);let b=t.createTBody();for(let h=0;h<24;h++)for(let min of [0,30]){let r=b.insertRow();r.appendChild(cell('th',`${String(h).padStart(2,'0')}:${String(min).padStart(2,'0')}`,'label'));r.appendChild(cell('td','', '',iso(date)+' '+h+':'+min))}}document.getElementById('prev').onclick=()=>{date.setDate(date.getDate()-1);render()};document.getElementById('next').onclick=()=>{date.setDate(date.getDate()+1);render()};render();</script></body></html>
