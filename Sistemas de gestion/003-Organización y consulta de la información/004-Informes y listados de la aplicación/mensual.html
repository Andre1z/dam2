<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario mensual</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;margin:18px;color:#111827;background:#ffffff}header{display:flex;align-items:center;gap:12px;background:#eff6ff;border-left:4px solid #1d4ed8;padding:12px;flex-wrap:wrap}h2{font-size:18px;margin:0 auto 0 0}button{padding:7px 12px;border:1px solid #1e40af;border-radius:10px;background:#ffffff;cursor:pointer}button:hover{background:#eff6ff}.wrap{overflow:auto;max-height:82vh;margin-top:12px}table{border-collapse:collapse;width:100%;table-layout:fixed;background:#ffffff}th,td{border:1px solid #dbeafe;text-align:center;padding:6px;font-size:12px}th{background:#eff6ff}td{cursor:pointer;height:105px;vertical-align:top;text-align:left;font-size:16px;padding:12px}td:hover{background:#dbeafe}.today{background:#dbeafe!important}.selected{background:#1d4ed8!important;color:#ffffff}.weekend{background:#eff6ff}.outside{color:#dbeafe;background:#ffffff}.note{font-size:12px;color:#1e40af;margin-top:12px}/* paleta-andrei */:root{--naranja:#f97316;--azul:#1d4ed8;--azul-medio:#1e40af;--azul-claro:#eff6ff;--azul-palido:#dbeafe;--blanco:#ffffff;--negro:#111827;--radio:12px}:where(button,input,select,textarea,fieldset,img,video,canvas,iframe,table,pre,dialog,details,article,section,aside,nav a,[class*="card"],[class*="tarjeta"],[class*="panel"],[class*="caja"],[class*="boton"],[class*="btn"],[class*="widget"],[class*="modal"]){border-radius:var(--radio)}</style></head><body><header><h2>Calendario mensual</h2><button id="prev">◀</button><button id="now">Hoy</button><button id="next">▶</button><strong id="period"></strong></header><div class="wrap"><table id="calendar"></table></div><p class="note">Pulsa una fecha para seleccionarla. La fecha actual aparece en verde claro.</p><script>const t=document.getElementById('calendar'),period=document.getElementById('period');let date=new Date(),selected=null;const days=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'],months=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const today=iso(new Date());function make(tag,txt,cls=''){const e=document.createElement(tag);e.textContent=txt;e.className=cls;return e}function addDate(d,cls=''){const key=iso(d),c=make('td',d.getDate(),cls);c.title=d.toLocaleDateString('es-ES',{dateStyle:'full'});if(key===today)c.classList.add('today');if(key===selected)c.classList.add('selected');c.onclick=()=>{selected=key;render()};return c}document.getElementById('now').onclick=()=>{date=new Date();render()};function render(){t.innerHTML='';const y=date.getFullYear(),m=date.getMonth();period.textContent=months[m]+' '+y;const thead=t.createTHead(),r=thead.insertRow();for(const d of days)r.appendChild(make('th',d));const start=new Date(y,m,1),offset=(start.getDay()+6)%7,last=new Date(y,m+1,0).getDate(),count=Math.ceil((offset+last)/7),tbody=t.createTBody();for(let w=0;w<count;w++){const tr=tbody.insertRow();for(let k=0;k<7;k++){const d=new Date(y,m,1+w*7+k-offset);tr.appendChild(addDate(d,(d.getMonth()!==m?'outside ':'')+(k>4?'weekend':'')))}}}document.getElementById('prev').onclick=()=>{date.setDate(1);date.setMonth(date.getMonth()-1);render()};document.getElementById('next').onclick=()=>{date.setDate(1);date.setMonth(date.getMonth()+1);render()};render();</script></body></html>
