
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario HTML</title>
<style>/* paleta-andrei */:root{--naranja:#f97316;--azul:#1d4ed8;--azul-medio:#1e40af;--azul-claro:#eff6ff;--azul-palido:#dbeafe;--blanco:#ffffff;--negro:#111827;--radio:12px}:where(button,input,select,textarea,fieldset,img,video,canvas,iframe,table,pre,dialog,details,article,section,aside,nav a,[class*="card"],[class*="tarjeta"],[class*="panel"],[class*="caja"],[class*="boton"],[class*="btn"],[class*="widget"],[class*="modal"]){border-radius:var(--radio)}body{background:var(--azul-claro);color:var(--negro);font-family:system-ui,sans-serif}a{color:var(--azul)}h1,h2,h3{color:var(--azul-medio)}button{background:var(--azul);color:var(--blanco);border:none;padding:8px 14px}button:hover{background:var(--naranja)}</style>
</head>
<body>

    <form action="procesar.php" method="POST">

        <label for="nombre">Nombre:</label>
        <input
            type="text"
            id="nombre"
            name="nombre"
            required
        >

        <label for="email">Correo electrónico:</label>
        <input
            type="email"
            id="email"
            name="email"
            required
        >

        <button type="submit">Enviar</button>

    </form>

</body>
</html>
